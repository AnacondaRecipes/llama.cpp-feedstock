anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: ggml-org/llama.cpp
      use_max_tag: true
      # Upstream ggml-org/llama.cpp stabilised on vX.Y.Z semver tags
      # (ggml-org/ggml#1579). We track those directly; b#### nightlies
      # are ignored by the auto-bumper.
      include_regex: ^v\d+\.\d+\.\d+$
      from_pattern: ^v(\d+\.\d+\.\d+)$
      to_pattern: \1
    packages:
      - gguf
      - libllama
      - llama.cpp
      - llama.cpp-tests
      - llama.cpp-tools
